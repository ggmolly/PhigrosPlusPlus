name: release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the tag
        run: test "$GITHUB_REF_NAME" = "v$(cat phigrospp/VERSION)"
      - name: Sign
        run: scripts/release.sh
        env:
          PHIGROSPP_SIGNING_KEY: ${{ secrets.PHIGROSPP_SIGNING_KEY }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="out/phigrospp.bundle out/phigrospp.version"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Phigros++ ${GITHUB_REF_NAME#v}" --generate-notes --latest
          fi
